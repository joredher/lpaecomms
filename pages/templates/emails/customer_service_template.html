<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>New Contact Message (REF {{reference_code}})</title>
</head>
<body style="font-family: Arial, sans-serif; background: linear-gradient(180deg, rgba(78, 181, 144, 0.7), rgba(53, 153, 143, 0.7) 50%, rgba(53, 124, 130, 0.7)); color: white; text-align: center; padding: 2rem;">

<img src="https://lpaecomms.test/assets/images/logo.svg" alt="LPA Ecommerce" width="120" style="margin-bottom: 20px;">

<h2>Reference Contact {{reference_code}}</h2>

<div style="background-color: white; color: #013a63; border-radius: 10px; padding: 1.5rem; text-align: left; max-width: 600px; margin: 1rem auto;">
    <p><strong>Name:</strong> {{name}}</p>
    <p><strong>Email:</strong> <a href="mailto:{{email}}" style="color: #357c82;">{{email}}</a></p>
    <p><strong>Phone:</strong> <a href="tel:{{phone_number}}" style="color: #357c82;">{{phone_number}}</a></p>
    <hr style="border: none; border-top: 1px solid #ccc;">
    <p><strong>Message:</strong></p>
    <p style="white-space: pre-wrap;">{{message}}</p>
</div>

<p style="font-size: 12px; margin-top: 40px;">This message was sent through the contact form on LPA Ecommerce.</p>
</body>
</html>
