<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Invoice Confirmation</title>
</head>
<body style="font-family: Arial, sans-serif; background: linear-gradient(180deg, rgba(78, 181, 144, 0.7), rgba(53, 153, 143, 0.7) 50%, rgba(53, 124, 130, 0.7)); color: white; text-align: center; padding: 2rem;">
<img src="https://lpaecomms.test/assets/images/logo.svg" alt="LPA Ecommerce" width="120" style="margin-bottom: 20px;">
<h2>Invoice {{invoice_number}}</h2>
<table style="width: 100%; border-collapse: collapse; background-color: white; color: #013a63; margin-top: 20px;">
    <thead>
    <tr>
        <th align="left" style="padding: 8px; border-bottom: 1px solid #ddd;">Item</th>
        <th align="right" style="padding: 8px; border-bottom: 1px solid #ddd;">Qty</th>
        <th align="right" style="padding: 8px; border-bottom: 1px solid #ddd;">Price</th>
        <th align="right" style="padding: 8px; border-bottom: 1px solid #ddd;">Total</th>
    </tr>
    </thead>
    <tbody>
    {{items}}
    </tbody>
</table>
<p style="margin-top: 20px;">Grand Total: <strong>${{total}}</strong></p>
<p style="font-size: 12px; margin-top: 30px;">Thank you for shopping with LPA Ecommerce.</p>
</body>
</html>
